<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Royal Jewellery</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #d4af37;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d4af37;
            background-color: #0b132b;
            color: #f4e8c1;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ROYAL JEWELLERY</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="ring.html">Rings</a></li>
                <li><a href="bracelet.html">Bracelets</a></li>                
                <li><a href="locket.html">Lockets</a></li>
                <li><a href="why-us.html">Why Us</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <h1 class="page-title">Contact Us</h1>

    <div style="max-width: 600px; margin: 30px auto; padding: 30px; background: #1c2541; border: 1px solid #d4af37; border-radius: 8px;">
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" required placeholder="Write Your Name">
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" required placeholder="Write Your Email">
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="4" required placeholder="Write Your Message..."></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%; cursor: pointer;">Send Message</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Royal Jewellery. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
